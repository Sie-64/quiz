<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz 后台管理</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-layout">
        <!-- 左侧侧边栏 -->
        <aside class="sidebar">
            <div class="logo-area">
                <div class="logo-icon">Q</div>
                <span>Quiz 题库管理</span>
            </div>
            <div class="menu-group">
                <div class="menu-title">工作台</div>
                <ul class="menu-list">
                    <li class="menu-item active" data-target="question">
                        <i class="icon">📝</i> 题目管理 <span class="badge" id="questionBadge">0</span>
                    </li>
                    <li class="menu-item" data-target="user">
                        <i class="icon">👥</i> 用户管理 <span class="badge" id="userBadge">0</span>
                    </li>
                </ul>
            </div>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="avatar">A</div>
                    <div>
                        <div class="name">管理员</div>
                        <div class="role">Web 开发技术</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 右侧主内容区 -->
        <main class="main-content">
            <header class="top-header">
                <div class="breadcrumb">Quiz 管理后台 > <span id="currentPageName">题目管理</span></div>
                <a href="#" class="front-link">打开答题前台 ↗</a>
            </header>

            <div class="content-wrapper">
                <div class="page-header">
                    <div>
                        <h1 id="pageTitle">题目管理</h1>
                        <p class="subtitle" id="pageSubtitle">整理题目、调整选项，为下一次答题做好准备。</p>
                    </div>
                </div>

                <div class="card">
                    <!-- 头部操作区 -->
                    <div class="card-header">
                        <h2 id="listTitle">题目列表</h2>
                        <div class="action-bar">
                            <div class="search-box">
                                <i class="search-icon">🔍</i>
                                <input type="text" id="searchInput" placeholder="输入关键词搜索...">
                            </div>
                            <button class="btn btn-primary" id="searchBtn">查询</button>
                            <button class="btn btn-default" id="resetBtn">重置</button>
                            <button class="btn btn-success" id="addBtn">+ 添加</button>
                        </div>
                    </div>

                    <!-- 数据表格 -->
                    <div class="table-container">
                        <table>
                            <thead id="tableHead"></thead>
                            <tbody id="tableBody"></tbody>
                        </table>
                    </div>
                    
                    <div id="emptyState" class="empty-state" style="display: none;">
                        没有找到匹配的数据
                    </div>

                    <div class="card-footer">
                        <div class="total-info" id="totalInfo">共 0 条数据</div>
                        <div class="pagination">
                            <button class="page-btn" disabled>〈</button>
                            <button class="page-btn active">1</button>
                            <button class="page-btn">〉</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 弹窗 (Modal) 结构 -->
    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">添加</h3>
                <span class="close-btn" id="closeModalBtn">&times;</span>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- 表单由 JS 动态生成 -->
            </div>
            <div class="modal-footer">
                <button class="btn btn-default" id="cancelBtn">取消</button>
                <button class="btn btn-primary" id="saveBtn">保存</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
